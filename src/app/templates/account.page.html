<main class="form-screen account-screen">
  <div class="page-heading"><button class="back" aria-label="Volver" (click)="router.navigateByUrl('/menu')">←</button><h1>Mi cuenta</h1><span class="heading-space"></span></div>
  <section class="account-card profile-card">
    <div class="avatar">👩🏻</div>
    <div><small>Nombre</small><strong>{{ user?.name }}</strong></div>
    <div><small>Correo electrónico</small><strong>{{ user?.email }}</strong></div>
  </section>
  <section class="password-card" *ngIf="user?.provider !== 'google'; else googlePassword">
    <h2>Cambiar contraseña</h2>
    <p>Usa una contraseña nueva que tenga al menos 6 caracteres.</p>
    <form (ngSubmit)="changePassword()">
      <label>Contraseña actual<input name="currentPassword" type="password" [(ngModel)]="currentPassword" autocomplete="current-password" required /></label>
      <label>Nueva contraseña<input name="newPassword" type="password" [(ngModel)]="newPassword" autocomplete="new-password" minlength="6" required /></label>
      <label>Confirmar nueva contraseña<input name="confirmPassword" type="password" [(ngModel)]="confirmPassword" autocomplete="new-password" minlength="6" required /></label>
      <p class="form-message" [class.form-error]="messageIsError" *ngIf="message">{{ message }}</p>
      <button class="primary full" type="submit">Guardar nueva contraseña</button>
    </form>
  </section>
  <ng-template #googlePassword><section class="password-card"><h2>Cuenta de Google</h2><p>Esta cuenta inicia sesión con Google. Administra su contraseña desde tu cuenta de Google.</p></section></ng-template>
</main>
