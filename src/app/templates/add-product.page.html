<main class="form-screen">
  <div class="page-heading"><button class="back" aria-label="Volver" (click)="router.navigateByUrl('/home')">←</button>
    <h1>Agregar producto</h1><span class="heading-space"></span>
  </div>
  <form class="product-form" (ngSubmit)="save()">
    <label>Nombre del producto *
      <input name="name" [(ngModel)]="name" placeholder="Ej: Leche" required minlength="2"
        maxlength="50" />
    </label>

    <label>Categoría *<select name="category" [(ngModel)]="category" (ngModelChange)="categoryChanged($event)">
        <option>Lácteos</option>
        <option>Frutas y verduras</option>
        <option>Carnes</option>
        <option>Bebidas</option>
        <option>Otros</option>
        <option value="Otra">Otra, escribir categoría</option>
      </select></label>

    <label *ngIf="category === 'Otra'">Tu categoría *
      <input name="customCategory" [(ngModel)]="customCategory" placeholder="Ej: Panadería" maxlength="40" required />
    </label>

    <label>Fecha de vencimiento *
      <input name="date" [(ngModel)]="date" type="date" [min]="today" required />
    </label>
    <label>Cantidad (opcional)
      <input name="quantity" [(ngModel)]="quantity" placeholder="Ej: 1 unidad, 500 g, etc."
        maxlength="40" />
    </label>
    <section class="photo-section" aria-label="Foto del producto">
      <h2>Foto del producto <span>(opcional)</span></h2>
      <div class="photo-preview" *ngIf="photo">
        <img [src]="photo" alt="Vista previa del producto" />
        <button
          type="button" class="remove-photo" (click)="photo = ''">Quitar imagen</button>
      </div>
      <div class="photo-actions">
        <button type="button" class="outline" (click)="takePhoto()">📷 &nbsp; Tomar foto</button>
        <button type="button" class="outline attach-image" (click)="chooseImage()">▧ &nbsp; Adjuntar imagen</button>
      </div>
      <p class="photo-hint">Puedes usar la cámara o elegir una imagen de tu dispositivo.</p>
    </section>
    <p class="error" *ngIf="error">{{ error }}</p>
    <button class="primary full save-button" type="submit">Guardar producto</button>
  </form>
</main>
