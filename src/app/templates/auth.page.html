    <main class="screen auth-screen">
      <button class="back" aria-label="Volver" (click)="router.navigateByUrl('/')">←</button>
      <img class="form-logo" src="assets/ecobites-logo.png" alt="EcoBites" />
      <section class="auth-card">
        <h1>{{ registering ? 'Crea tu cuenta' : '¡Bienvenido de nuevo!' }}</h1>
        <p>{{ registering ? 'Únete y empieza a cuidar tus alimentos' : 'Inicia sesión para continuar' }}</p>
        <form (ngSubmit)="submit()">
          <label *ngIf="registering">Nombre completo<input name="name" [(ngModel)]="name" autocomplete="name" placeholder="♙  Nombre completo" required minlength="2" /></label>
          <label>Correo electrónico<input name="email" [(ngModel)]="email" type="email" autocomplete="email" placeholder="✉  Correo electrónico" required /></label>
          <label>Contraseña<input name="password" [(ngModel)]="password" type="password" [autocomplete]="registering ? 'new-password' : 'current-password'" placeholder="♙  Contraseña" required minlength="6" /></label>
          <label *ngIf="registering">Confirmar contraseña<input name="confirm" [(ngModel)]="confirm" type="password" autocomplete="new-password" placeholder="♙  Confirmar contraseña" required /></label>
          <p class="error" *ngIf="error">{{ error }}</p>
          <button class="primary full" type="submit">{{ registering ? 'Crear cuenta' : 'Iniciar sesión' }}</button>
        </form>
        <div class="divider">──────── &nbsp; o &nbsp; ────────</div>
        <button class="outline full" (click)="googleSignIn()" [disabled]="googleLoading">{{ googleLoading ? 'Conectando con Google…' : 'G &nbsp; Continuar con Google' }}</button>
        <button class="text-button full" (click)="toggle()">{{ registering ? '¿Ya tienes una cuenta?  Inicia sesión' : '¿No tienes una cuenta?  Regístrate' }}</button>
      </section>
    </main>
