    <main class="app-screen settings-screen">
      <div class="page-heading"><button class="back" aria-label="Volver" (click)="router.navigateByUrl('/menu')">←</button><h1>Configuración</h1><span class="heading-space"></span></div>
      <nav class="settings-menu">
        <label class="setting-row"><span>◉ &nbsp;&nbsp; Idioma</span><select (change)="setLanguage($event)"><option [selected]="language === 'Español'">Español</option><option [selected]="language === 'English'">English</option></select></label>
        <label class="setting-row"><span>☾ &nbsp;&nbsp; Modo oscuro</span><input type="checkbox" [checked]="dark" (change)="toggleDark($event)" /></label>
        <label class="setting-row"><span>♧ &nbsp;&nbsp; Notificaciones</span><input type="checkbox" [checked]="notifications" (change)="toggleNotifications($event)" /></label>
        <button>♢ &nbsp;&nbsp; Privacidad <span>›</span></button>
        <button>ⓘ &nbsp;&nbsp; Acerca de EcoBites <span>›</span></button>
        <div class="menu-divider"></div>
      </nav>
      <footer class="settings-footer">Juntos por un planeta más limpio 🌱</footer>
    </main>
