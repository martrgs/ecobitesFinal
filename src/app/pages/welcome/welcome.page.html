<main class="welcome screen">
  <img class="welcome-logo" src="assets/ecobites-logo.png" alt="EcoBites" />
  <h1>{{ 'Menos desperdicio,' | t }}<br />{{ 'más vida para el planeta' | t }}</h1>
  <img class="welcome-mascot" src="assets/ecobites-mascot.png" alt="Mascota EcoBites" />
  <div class="welcome-actions">
    <button class="primary full" (click)="openAuth('login')">{{ 'Iniciar sesión' | t }}</button>
    <button class="outline full" (click)="openAuth('register')">{{ 'Registrarse' | t }}</button>
  </div>
</main>
