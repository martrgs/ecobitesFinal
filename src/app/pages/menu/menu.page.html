<main class="app-screen menu-screen">
  <header class="settings-header">
    <button class="settings-back" [attr.aria-label]="'Volver' | t" (click)="router.navigateByUrl('/home')">←</button>
    <div class="avatar user-avatar" [style.background-color]="userAvatarColor">{{ userInitial }}</div>
    <div class="settings-user">
      <h1>{{ user?.name }}</h1>
      <p>{{ user?.email }}</p>
    </div>
    <button
      class="header-icon menu-settings-button"
      aria-label="Configuración"
      (click)="router.navigateByUrl('/settings')"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2" />
        <path
          d="M19.4 13.5a7.8 7.8 0 0 0 0-3l1.5-1.2-1.5-2.6-1.9.7a7.5 7.5 0 0 0-2.6-1.5L14.6 4h-3.1l-.3 1.9a7.5 7.5 0 0 0-2.6 1.5l-1.9-.7-1.5 2.6 1.5 1.2a7.8 7.8 0 0 0 0 3l-1.5 1.2 1.5 2.6 1.9-.7a7.5 7.5 0 0 0 2.6 1.5l.3 1.9h3.1l.3-1.9a7.5 7.5 0 0 0 2.6-1.5l1.9.7 1.5-2.6z"
        />
      </svg>
    </button>
  </header>
  <nav class="settings-menu">
    <button class="active" (click)="router.navigateByUrl('/home')">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10 8.5-7 8.5 7v10.5h-6v-7h-5v7h-6z" /></svg
      ><span>{{ 'Inicio' | t }}</span>
    </button>
    <button (click)="router.navigateByUrl('/products')">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="4" width="16" height="16" rx="1.5" />
        <rect x="8" y="8" width="8" height="8" rx=".5" /></svg
      ><span>{{ 'Productos' | t }}</span>
    </button>
    <button (click)="search()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="10.8" cy="10.8" r="6.8" />
        <path d="m16 16 5 5" /></svg
      ><span>{{ 'Buscar' | t }}</span>
    </button>
    <button (click)="router.navigateByUrl('/settings')">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3" />
        <path
          d="M19.4 13.5a7.8 7.8 0 0 0 0-3l1.5-1.2-1.5-2.6-1.9.7a7.5 7.5 0 0 0-2.6-1.5L14.6 4h-3.1l-.3 1.9a7.5 7.5 0 0 0-2.6 1.5l-1.9-.7-1.5 2.6 1.5 1.2a7.8 7.8 0 0 0 0 3l-1.5 1.2 1.5 2.6 1.9-.7a7.5 7.5 0 0 0 2.6 1.5l.3 1.9h3.1l.3-1.9a7.5 7.5 0 0 0 2.6-1.5l1.9.7 1.5-2.6z"
        /></svg
      ><span>{{ 'Configuración' | t }}</span>
    </button>
    <button (click)="router.navigateByUrl('/account')">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="7.5" r="3.5" />
        <path d="M4.5 21v-2a7.5 7.5 0 0 1 15 0v2z" /></svg
      ><span>{{ 'Mi cuenta' | t }}</span>
    </button>
    <div class="menu-divider"></div>
    <button
      class="logout-item button-with-spinner"
      (click)="logout()"
      [disabled]="loggingOut"
      [attr.aria-busy]="loggingOut"
    >
      @if (loggingOut) { <span class="button-spinner" aria-hidden="true"></span> } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4h9v16h-9M3 12h12m-5-5 5 5-5 5" /></svg>
      }<span>{{ (loggingOut ? 'Cerrando sesión…' : 'Cerrar sesión') | t }}</span>
    </button>
  </nav>
</main>
